steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/bq-app-repo/backend:$COMMIT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/bq-app-repo/backend:$COMMIT_SHA']
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['run', 'deploy', 'bq-app-backend',
          '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/bq-app-repo/backend:$COMMIT_SHA',
          '--region', 'us-central1',
          '--platform', 'managed',
          '--allow-unauthenticated']
images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/bq-app-repo/backend:$COMMIT_SHA'