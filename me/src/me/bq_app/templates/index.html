<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Cost Analyzer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>BigQuery Cost Analyzer</h1>
    
    <h2>Recent Queries</h2>
    <table id="queries-table">
        <thead>
            <tr>
                <th>Query Hash</th>
                <th>Timestamp</th>
                <th>Total Slot Milliseconds</th>
                <th>Total Bytes Processed</th>
                <th>Total Rows</th>
                <th>Query Text</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be populated by JavaScript -->
        </tbody>
    </table>

    <script src="/static/app.js"></script>
</body>
</html>
