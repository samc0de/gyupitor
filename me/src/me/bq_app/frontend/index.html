<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrewAI BigQuery Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #1a1a2e; color: #e0e0e0; }
        .container { max-width: 800px; margin: auto; background-color: #2a2a4a; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); }
        h1 { color: #8be9fd; }
        button { background-color: #6272a4; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #44475a; }
        pre { background-color: #282a36; padding: 15px; border-radius: 5px; overflow-x: auto; color: #f8f8f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CrewAI BigQuery Analyzer</h1>
        <button id="runButton">Run Analysis</button>
        <h2>Status</h2>
        <pre id="status">Idle</pre>
        <h2>Result</h2>
        <pre id="result">No result yet.</pre>
    </div>

    <script>
        const runButton = document.getElementById('runButton');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        runButton.addEventListener('click', async () => {
            statusDiv.textContent = 'Starting...';
            runButton.disabled = true;
            try {
                const response = await fetch('/start', { method: 'POST' });
                const data = await response.json();
                const taskId = data.task_id;
                statusDiv.textContent = `Task started with ID: ${taskId}. Polling for result...`;
                pollStatus(taskId);
            } catch (error) {
                statusDiv.textContent = `Error starting task: ${error}`;
                runButton.disabled = false;
            }
        });

        async function pollStatus(taskId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${taskId}`);
                    const data = await response.json();
                    if (data.status === 'SUCCESS') {
                        statusDiv.textContent = 'Task completed!';
                        resultDiv.textContent = JSON.stringify(data.result, null, 2);
                        clearInterval(interval);
                        runButton.disabled = false;
                    } else {
                        statusDiv.textContent = 'Task is pending...';
                    }
                } catch (error) {
                    statusDiv.textContent = `Error polling status: ${error}`;
                    clearInterval(interval);
                    runButton.disabled = false;
                }
            }, 5000);
        }
    </script>
</body>
</html>
