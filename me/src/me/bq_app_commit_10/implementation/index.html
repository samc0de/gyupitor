<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Optimization Recommendations</title>
    <style>
        :root {
            --primary-bg: #1a1a2e;
            --secondary-bg: #16213e;
            --card-bg: #0f3460;
            --text-color: #e94560;
            --body-text-color: #dcdcdc;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --border-radius: 8px;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: var(--font-family);
            background-color: var(--primary-bg);
            color: var(--body-text-color);
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background-color: var(--secondary-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--text-color);
        }

        header h1 {
            color: var(--text-color);
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.1rem;
            color: var(--body-text-color);
            margin-top: 0.5rem;
        }

        .loading, .error {
            text-align: center;
            padding: 3rem;
            background-color: var(--secondary-bg);
            border-radius: var(--border-radius);
            font-size: 1.2rem;
            color: var(--text-color);
        }

        #recommendations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border-left: 4px solid transparent; /* Placeholder for type color */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid #16213e;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .card-icon {
            font-size: 2rem;
        }
        
        .card-title {
            color: var(--text-color);
            font-size: 1.4rem;
            margin: 0;
        }

        .card-body p {
            margin: 0;
            font-size: 1rem;
        }

        /* Category-specific styling */
        .card[data-category="Cost"] { border-left-color: #4CAF50; } /* Green for Finance */
        .card[data-category="Performance"] { border-left-color: #2196F3; } /* Blue for DevOps */
        .card[data-category="Security"] { border-left-color: #f44336; } /* Red for Security */
        .card[data-category="Architecture"] { border-left-color: #FFC107; } /* Amber for Architects */
        
        .card[data-category="Cost"] .card-icon::before { content: '💰'; }
        .card[data-category="Performance"] .card-icon::before { content: '🚀'; }
        .card[data-category="Security"] .card-icon::before { content: '🛡️'; }
        .card[data-category="Architecture"] .card-icon::before { content: '🏗️'; }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cloud Optimization Dashboard</h1>
            <p>Actionable recommendations for improving cost, performance, and security.</p>
        </header>

        <main id="recommendations-container">
            <div id="loading-state" class="loading">
                <p>Fetching recommendations...</p>
            </div>
            <div id="recommendations-grid"></div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const recommendationsGrid = document.getElementById('recommendations-grid');
            const loadingState = document.getElementById('loading-state');
            const container = document.getElementById('recommendations-container');
            
            const apiUrl = '/api/recommendations';

            async function fetchRecommendations() {
                try {
                    const response = await fetch(apiUrl);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    loadingState.style.display = 'none';
                    renderRecommendations(data);

                } catch (error) {
                    console.error('Failed to fetch recommendations:', error);
                    loadingState.style.display = 'none';
                    container.innerHTML = `<div class="error"><p><strong>Error:</strong> Could not load recommendations. Please ensure the backend service is running and accessible.</p><p><small>${error.message}</small></p></div>`;
                }
            }

            function renderRecommendations(recommendations) {
                if (!recommendations || recommendations.length === 0) {
                    recommendationsGrid.innerHTML = '<p>No recommendations available at the moment.</p>';
                    return;
                }

                recommendations.forEach(rec => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const category = rec.category || 'Architecture';
                    card.setAttribute('data-category', category);

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-icon" aria-hidden="true"></span>
                            <h2 class="card-title">${rec.title}</h2>
                        </div>
                        <div class="card-body">
                            <p>${rec.description}</p>
                        </div>
                    `;
                    recommendationsGrid.appendChild(card);
                });
            }

            fetchRecommendations();
        });
    </script>
</body>
</html>
