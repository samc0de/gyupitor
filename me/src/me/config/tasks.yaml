initial_bq_analysis_task:
  description: "Analyze BigQuery's `INFORMATION_SCHEMA.JOBS_BY_PROJECT`. Identify the most common, expensive, and inefficient queries. Based on this data, propose a concrete set of initial strategies for cost optimization."
  expected_output: "A detailed report containing: 1. A summary of findings from the jobs schema. 2. A list of specific optimization recommendations (e.g., query rewrites, schema adjustments). 3. An estimate of potential cost savings for each recommendation."
  agent: bq_expert

initial_architecture_task:
  description: "Based on the findings from the initial BigQuery analysis, design the core architecture for a cost-optimization application. The design must cover the tech stack for data processing, a simple API (e.g., FastAPI), and a basic data model for storing results and recommendations. Also, define the initial deployment strategy on a cloud platform."
  expected_output: "An architecture document including: 1. A diagram of the system components. 2. A list of chosen technologies (e.g., Python, FastAPI, Docker). 3. A clear data model. 4. Step-by-step deployment plan."
  agent: software_architect

initial_ui_design_task:
  description: "Collaborate with the Software Architect to design a GOOD, clean, and effective user interface for the initial version of the BQ cost-optimization app. The UI should present the analysis results and optimization recommendations clearly to FinOps and BQ engineering users. The design should be practical for a first version."
  expected_output: "A set of high-fidelity mockups for the main dashboard and recommendation views, along with a basic style guide. The design should be delivered in a format that the Polyglot Developer can easily implement."
  agent: ui_ux_designer

development_kickoff_task:
  description: "Take the architecture document and UI mockups and begin implementing the initial version of the application. Start by setting up the project structure, building the FastAPI backend, and creating the initial UI components."
  expected_output: "A link to a Git repository with the initial codebase, including a running backend service and the basic UI framework. The developer should provide a brief status update on what has been completed."
  agent: polyglot_developer

user_update_task:
  description: "Synthesize the progress from the BQ analysis, architecture design, and UI design into a concise update for the user. Present the initial plan and designs, and ask for feedback before full-scale development begins."
  expected_output: "A clear, well-structured summary of the project's direction, including key findings and design choices, presented as a message to the user."
  agent: customer_chatbot
