analyze_minimized_jobs_task:
  description: >-
    **Task: Analyze pre-processed BigQuery job data and create a consolidated recommendations report.**
    
    **CONTEXT:** The BigQuery job data has already been fetched and pre-processed for you. Your job is to analyze this data to identify systemic inefficiencies and opportunities for optimization.
    
    **CRITICAL WORKFLOW:**
    1. **Read the Minimized Job Data:** Use the FileReaderTool to read the pre-processed data from the `{job_run_dir}/bq_results/bq_jobs_minimized.json` file.
    2. **Holistic Analysis:** Analyze the **entire list** of jobs to identify systemic issues. Consider patterns in slot usage, timeline summaries, user behavior, and any other relevant metrics.
    3. **Generate Consolidated Recommendations:** Based on your holistic analysis, generate a set of actionable recommendations. Each recommendation should address a systemic issue and have a clear `remediation_action`.
    4. **Save the Initial Report:** Create a new `recommendations.json` file in the `{job_run_dir}/bq_results/` directory and save your findings.
    
  expected_output: "The file path to the newly created recommendations.json file."
  agent: bq_expert

analyze_unique_queries_task:
  description: >-
    **Task: Perform a deep-dive analysis of the unique BigQuery SQL queries.**
    
    **CONTEXT:** This is the second analysis step. A file containing all unique queries has been prepared for you. Your task is to analyze these queries for performance and cost anti-patterns.
    
    **Execution Steps:**
    1. **Read the Unique Queries:** Use the FileReaderTool to read the list of unique queries from `{job_run_dir}/bq_results/unique_queries.json`.
    2. **Analyze SQL Queries:** For each query, analyze it for performance and cost anti-patterns.
    3. **Generate Explanations and Modified Queries:** For each query that has an issue, you MUST provide:
        - An `explanation`: A clear, detailed explanation of the issue.
        - A `modified_query`: The full, rewritten query that fixes the issue.
    4. **Read, Append, and Write:** This task enriches the existing report. You MUST first read the `recommendations.json` file. Then, append your new, query-specific recommendations to it. Finally, use the FileWriterTool a SINGLE TIME to write the updated file back to the same path.
    
  expected_output: "The file path to the updated recommendations.json file, now containing detailed query recommendations."
  agent: bq_expert
