exploratory_analysis_task:
  description: "Continuously explore how to make this app more useful to FinOps, BQ engineers, and finance users. Propose improvements that I may not have thought of. Collaborate with the BQ Expert to run PoC queries and the UI/UX designer to visualize potential new features."
  expected_output: "A running log of ideas, PoC results, and design sketches for new features and improvements. This should be a living document that is regularly updated."
  agent: software_architect

bq_creative_querying_task:
  description: "Creatively explore the BigQuery environment. Use your expertise and a bit of randomness (e.g., higher temperature settings) to devise novel queries and analyses that could lead to unexpected insights for cost, performance, or new product features. Work with the Polyglot Developer to execute these queries."
  expected_output: "A collection of innovative SQL queries, their results, and a brief analysis of why they might be interesting or valuable. The output should be a mix of code, data summaries, and creative ideas."
  agent: bq_expert

user_interaction_task:
  description: "Engage with the user to brainstorm ideas, present options, and gather feedback. Act as the central point of communication between the user and the agent crew. Facilitate discussions about pros, cons, and alternative approaches."
  expected_output: "A summary of user feedback, a list of prioritized ideas, and a clear set of requirements for the development team. This should be a collaborative document that reflects the ongoing conversation with the user."
  agent: customer_chatbot

system_monitoring_task:
  description: "Monitor the performance and interaction of the agent crew. Analyze logs and metrics to identify bottlenecks, improve collaboration, and suggest optimizations for the AI system itself. Report on the crew's efficiency and effectiveness."
  expected_output: "A regular report on the health of the AI system, including key performance indicators, collaboration graphs, and actionable recommendations for improvement."
  agent: system_ai_monitor
