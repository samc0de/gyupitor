create_job_run_directory_task:
  description: >-
    **Task: Create a new job run directory.**
    Kick off a new job run by creating a unique directory. The directory name should be in the format 'job_runs/YYYYMMDD_HHMMSS'.
  expected_output: "The file path to the newly created job run directory (e.g., 'job_runs/20231027_103000/')."
  agent: bq_expert

execute_bigquery_query_task:
  description: >-
    **Task: Execute the following query and save the results.**
    Execute a SPECIFIC BigQuery query, handle errors, and save the results to a file.
    **CRITICAL: The query MUST be executed EXACTLY as written below, without modification.**

    ```sql
    SELECT * FROM `region-us`.INFORMATION_SCHEMA.JOBS_BY_ORGANIZATION
    WHERE creation_time BETWEEN TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 30 DAY) AND CURRENT_TIMESTAMP()
    ORDER BY COALESCE(total_bytes_billed, 0) DESC, total_slot_ms DESC
    LIMIT 500;
    ```
  expected_output: "The file path to the newly created file containing the query results."
  agent: bq_expert

analyze_and_save_results_task:
  description: >-
    **Task: Perform BigQuery analysis from cost and performance focus mainly, looking for ALL improvements including query inefficiencies, scrutinise everything, and create a structured report including recommendations, remedies and cost savings focus. Below query gives big results, the bigquery_tool gives batches, write the results for each batch in a new job run directory. Use your expertise to provide as much insights, recommendations and anything you feel important, write every detail in structured files(json, yaml, csv) AND WRITE A document to explain which file contains what data, how the information is contained in that directory.**
    This is production grade, there are sophisiticated UI infographics to be built on this, structured data is important.
    ALSO, do not mock any data, do not skip any data, analyse everything. IT IS imperative that you cover all batches fully, write structured o/p for everything, do not add anything unstructured to those files (use yaml if you want to add comments). Only file that can be unstructured is the manifest.
  expected_output: "The file path to the newly created analysis directory (e.g., 'job_runs/20231027_103000/analysis/')."
  agent: bq_expert

