execute_bq_query_task:
  description: "Execute the following BigQuery SQL query using the BigQuery Tool to find the top 500 most expensive queries in the entire GCP organization over the last 30 days.
  **CRITICAL: You must execute this query exactly as written, without any modifications.**

  ```sql
  SELECT * FROM `region-us`.INFORMATION_SCHEMA.JOBS_BY_ORGANIZATION
  WHERE creation_time BETWEEN TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 30 DAY) AND CURRENT_TIMESTAMP()
  ORDER BY COALESCE(total_bytes_billed, 0) DESC, total_slot_ms DESC
  LIMIT 500
  ```

  The tool will automatically cache the results."
  expected_output: "A confirmation message stating that the query has been executed and the results are cached. The output should be a simple string, not the data itself."
  agent: bq_expert

analyze_bq_results_task:
  description: >-
    **CRITICAL: You MUST use the File Reader Tool to complete this task.**
    A previous task has already executed a BigQuery query and saved the results to a local cache file.
    Your goal is to analyze this data to find the best opportunities for cost optimization.

    **Instructions:**
    1. Use the "File Reader Tool" to read the contents of the results file located at `.bq_cache/query_results/`.
    2. Analyze the JSON data. Pay close attention to `total_bytes_billed`, `total_slot_ms`, `user_email`, and the new `timeline_metrics` field.
    3. The `timeline_metrics` contains a `top_stages_summary` which lists the 3 longest-running stages of a query. This is a strong indicator of inefficiency.
    4. Based on your analysis of the summary data, identify the top 3-5 `query_hash` values that appear to be the most expensive or inefficient.
    5. **For each of these top hashes, you MUST use the "File Reader Tool" again** to read the corresponding full SQL query from the `.bq_cache/raw_queries/` directory (e.g., `.bq_cache/raw_queries/<query_hash>.sql`).
    6. Review the full SQL query and provide specific, actionable optimization recommendations.
  expected_output: "A detailed report with a list of the top 3-5 query hashes to investigate. For each query hash, provide the full SQL text and a clear, actionable recommendation for how to optimize it for better BigQuery performance and cost-efficiency."
  agent: bq_expert

