<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Optimization Recommendations</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #03dac6;
            --secondary-color: #bb86fc;
            --text-color: #e0e0e0;
            --text-secondary-color: #b0b0b0;
            --border-color: #333;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 24px;
        }
        #app {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
            color: var(--primary-color);
        }
        .filters {
            display: flex;
            gap: 12px;
        }
        .filters button {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        .filters button:hover, .filters button.active {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border-color: var(--primary-color);
        }
        .recommendation-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 20px;
            transition: box-shadow 0.3s;
        }
        .recommendation-card:hover {
            box-shadow: 0 0 15px rgba(3, 218, 198, 0.2);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .card-header h2 {
            margin: 0 0 8px 0;
            color: var(--secondary-color);
            font-size: 1.4em;
        }
        .card-tags {
            display: flex;
            gap: 8px;
        }
        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }
        .tag.finance { background-color: #2e7d32; color: white; }
        .tag.devops { background-color: #1565c0; color: white; }
        .tag.security { background-color: #c62828; color: white; }
        .tag.data { background-color: #ff8f00; color: white; }
        .tag.ops { background-color: #6a1b9a; color: white; }
        .card-body p {
            margin: 8px 0;
            line-height: 1.6;
        }
        .visualizations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .viz-item {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 6px;
        }
        .viz-item h4 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 1em;
        }
        .bar-chart-container {
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar {
            height: 100%;
            border-radius: 10px 0 0 10px;
            background-image: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
        }
        #loading, #error {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: var(--text-secondary-color);
        }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <h1>Cloud Optimization</h1>
            <div class="filters">
                <button id="filter-all" class="active">All</button>
                <button id="filter-finance">Finance</button>
                <button id="filter-devops">DevOps</button>
                <button id="filter-security">Security</button>
                <button id="filter-data">Data</button>
                <button id="filter-ops">Ops</button>
            </div>
        </header>

        <main id="recommendations-container">
            <div id="loading">Loading recommendations...</div>
            <div id="error" style="display:none;"></div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_URL = '/api/recommendations';
            const container = document.getElementById('recommendations-container');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const filters = document.querySelector('.filters');
            let allRecommendations = [];

            const fetchData = async () => {
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText}`);
                    }
                    const data = await response.json();
                    allRecommendations = data;
                    renderRecommendations(data);
                } catch (e) {
                    console.error('Fetch error:', e);
                    loadingDiv.style.display = 'none';
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = `Failed to load recommendations. Please ensure the backend is running. Error: ${e.message}`;
                }
            };

            const renderRecommendations = (recommendations) => {
                loadingDiv.style.display = 'none';
                container.innerHTML = ''; 
                if (recommendations.length === 0) {
                    container.innerHTML = '<p>No recommendations found for the selected filter.</p>';
                    return;
                }
                recommendations.forEach(rec => {
                    const card = document.createElement('div');
                    card.className = 'recommendation-card';
                    card.dataset.tags = rec.personas.join(' ');

                    let tagsHtml = rec.personas.map(p => `<span class="tag ${p.toLowerCase()}">${p}</span>`).join('');

                    let vizHtml = `
                        <div class="visualizations">
                            <div class="viz-item">
                                <h4>Potential Monthly Savings</h4>
                                <div style="font-size: 1.5em; color: white;">$${rec.metrics.cost_saving.toFixed(2)}</div>
                            </div>
                            <div class="viz-item">
                                <h4>Effort Level</h4>
                                <div class="bar-chart-container">
                                    <div class="bar" style="width: ${rec.metrics.effort_level * 10}%;"></div>
                                </div>
                            </div>
                            <div class="viz-item">
                                <h4>Risk / Impact</h4>
                                <div class="bar-chart-container">
                                    <div class="bar" style="width: ${rec.metrics.risk_level * 10}%;"></div>
                                </div>
                            </div>
                        </div>
                    `;

                    card.innerHTML = `
                        <div class="card-header">
                            <h2>${rec.title}</h2>
                            <div class="card-tags">${tagsHtml}</div>
                        </div>
                        <div class="card-body">
                            <p><strong>Recommendation:</strong> ${rec.recommendation}</p>
                            <p><strong>Affected Service:</strong> ${rec.service}</p>
                            <p><strong>Details:</strong> ${rec.details}</p>
                            ${vizHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            };

            filters.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    const filter = e.target.id.replace('filter-', '');

                    if (filter === 'all') {
                        renderRecommendations(allRecommendations);
                    } else {
                        const filteredData = allRecommendations.filter(rec => rec.personas.includes(filter.charAt(0).toUpperCase() + filter.slice(1)));
                        renderRecommendations(filteredData);
                    }
                }
            });

            fetchData();
        });
    </script>

</body>
</html>
