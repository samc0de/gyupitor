[project]
name = "me"
version = "0.1.0"
description = "me using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.175.0,<1.0.0"
]

[project.scripts]
me = "me.main:run"
run_crew = "me.main:run"
train = "me.main:train"
replay = "me.main:replay"
test = "me.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
